# configs/smoke.yaml -- the same pipeline, tiny. Owner: T3.
#
# Purpose: check in about 15 minutes on Kaggle (T4 x2) that all four arms
# train and evaluate end to end. Numbers from this config are never reported.
# Keep the keys identical to default.yaml; only the sizes differ.

teacher: Qwen/Qwen3-4B
student: Qwen/Qwen3-0.6B

devices:
  student: cuda:0
  teacher: cuda:1

data:
  pool_size: 16                   # 16 questions -> 4 steps of 4
  pool_seed: 0
  teacher_sequences: data/teacher_sequences_smoke.jsonl   # not committed

train:
  questions_per_step: 4
  epochs: 1
  max_steps: null
  optimizer: adamw
  lr: 1.0e-5
  grad_clip: 1.0
  loss: forward_kl
  temperature: 1.0
  student_dtype: float32
  autocast_dtype: float16
  oom_retries: 2
  log_every: 1

generation:
  max_new_tokens: 128             # short answers keep the smoke test fast
  sampling:
    temperature: 0.7
    top_p: 0.8
    top_k: 20
  teacher_decoding: greedy

eval:
  split: test
  n_questions: 20                 # needs E2's 30_evaluate.py to read eval.n_questions
  batch_size: 8

seeds: [1]
